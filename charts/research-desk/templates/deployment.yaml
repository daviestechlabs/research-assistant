apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "desk.name" . }}
  labels:
    {{- include "desk.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 0 1 .Values.suspend }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "desk.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "desk.selector" . | nindent 8 }}
        {{- if .Values.legacyDeployment }}
        app.kubernetes.io/name: research-assistant
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 501
        runAsGroup: 20
        fsGroup: 20
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: research
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          args: [serve, --db, {{ printf "/catalog/%s" .Values.storage.catalogFile | quote }}, --memory-mib, {{ .Values.storage.memoryMiB | quote }}, --listen, "0.0.0.0:8080"]
          envFrom:
            - configMapRef:
                name: {{ include "desk.configName" . }}
          env:
            {{- if .Values.indexing.arxivAutoMerge.enabled }}
            - name: RESEARCH_ARXIV_AUTO_MERGE
              value: "true"
            - name: RESEARCH_ARXIV_AUTO_MERGE_HOURS
              value: {{ .Values.indexing.arxivAutoMerge.intervalHours | quote }}
            - name: RESEARCH_ARXIV_AUTO_MERGE_MIN_FREE_GIB
              value: {{ .Values.indexing.arxivAutoMerge.minFreeGiB | quote }}
            {{- end }}
            {{- if .Values.arxivSync.enabled }}
            - name: RESEARCH_ARXIV_SYNC_ROOT
              value: {{ printf "/catalog/%s" .Values.arxivSync.directory | quote }}
            - name: RESEARCH_ARXIV_UPDATES_ENABLED
              value: {{ .Values.indexing.arxivUpdatesEnabled | quote }}
            {{- end }}
            - name: RESEARCH_MODEL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inference.secretName }}
                  key: {{ .Values.inference.secretKey }}
            {{- if .Values.nas.endpoint }}
            - name: RESEARCH_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nas.secretName }}
                  key: {{ .Values.nas.accessKey }}
            - name: RESEARCH_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nas.secretName }}
                  key: {{ .Values.nas.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: catalog
              mountPath: /catalog
            - name: tmp
              mountPath: /tmp
            {{- if .Values.indexing.enabled }}
            - name: index-config
              mountPath: /index-config
              readOnly: true
            {{- end }}
            {{- if .Values.branding.configMapName }}
            - name: private-config
              mountPath: /private-config
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 150
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: catalog
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

        {{- if .Values.branding.configMapName }}
        - name: private-config
          configMap:
            name: {{ .Values.branding.configMapName }}
        {{- end }}

        {{- if .Values.indexing.enabled }}
        - name: index-config
          configMap:
            name: {{ .Values.indexing.configMapName }}
        {{- end }}
