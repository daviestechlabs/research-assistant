{{- if .Values.indexing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "desk.name" . }}-indexer
  labels:
    {{- include "desk.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 0 1 .Values.suspend }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: research-indexer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-indexer
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.indexing.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 501
        runAsGroup: 20
        fsGroup: 20
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: {{ printf "%s@%s" .Values.image.repository (.Values.indexing.imageDigest | default .Values.image.digest) | quote }}
          args: [index-worker]
          # No chat key, OIDC configuration, or Kubernetes token reaches this worker.
          env:
            {{- if and .Values.arxivSync.enabled .Values.indexing.arxivUpdatesEnabled }}
            - name: RESEARCH_ARXIV_SYNC_ROOT
              value: {{ printf "/catalog/%s" .Values.arxivSync.directory | quote }}
            {{- end }}
            {{- if .Values.indexing.trustConfigMapName }}
            - name: SSL_CERT_FILE
              value: /index-trust/ca.crt
            {{- end }}
            - name: RESEARCH_INDEX_ROOT
              value: {{ printf "/catalog/%s" .Values.indexing.directory | quote }}
            - name: RESEARCH_INDEX_CONFIG
              value: /index-config/indexing.json
            - name: RESEARCH_INDEX_ORIGINAL_CATALOG
              value: {{ printf "/catalog/%s" .Values.storage.catalogFile | quote }}
            {{- range .Values.indexing.credentialEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- if .Values.nas.endpoint }}
            - name: RESEARCH_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nas.secretName }}
                  key: {{ .Values.nas.accessKey }}
            - name: RESEARCH_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nas.secretName }}
                  key: {{ .Values.nas.secretKey }}
            {{- end }}
            - name: RESEARCH_S3_ENDPOINT
              value: {{ .Values.nas.endpoint | quote }}
            - name: RESEARCH_S3_BUCKET
              value: {{ .Values.nas.bucket | quote }}
            - name: RESEARCH_S3_PDF_PREFIX
              value: {{ .Values.nas.pdfPrefix | quote }}
            - name: RESEARCH_S3_PDF_SHARDS
              value: {{ .Values.nas.pdfShards | quote }}
            - name: RESEARCH_S3_REGION
              value: {{ .Values.nas.region | quote }}
            - name: RESEARCH_BOOK_MANIFEST
              value: {{ .Values.books.manifestFile | quote }}
            - name: RESEARCH_BOOK_PLAN_SHA256
              value: {{ .Values.books.planSHA256 | quote }}
            - name: RESEARCH_BOOK_COUNT
              value: {{ .Values.books.count | quote }}
          resources:
            {{- toYaml .Values.indexing.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: catalog
              mountPath: /catalog
            - name: index-config
              mountPath: /index-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.indexing.trustConfigMapName }}
            - name: index-trust
              mountPath: /index-trust
              readOnly: true
            {{- end }}
            {{- if .Values.branding.configMapName }}
            - name: private-config
              mountPath: /private-config
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.indexing.trustConfigMapName }}
        - name: index-trust
          configMap:
            name: {{ .Values.indexing.trustConfigMapName }}
        {{- end }}
        - name: catalog
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim }}
        - name: index-config
          configMap:
            name: {{ .Values.indexing.configMapName }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if .Values.branding.configMapName }}
        - name: private-config
          configMap:
            name: {{ .Values.branding.configMapName }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "desk.name" . }}-indexer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: research-indexer
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.network.modelNamespace }}
          podSelector:
            matchLabels: {app.kubernetes.io/name: embeddings, app.kubernetes.io/instance: embeddings}
      ports: [{port: 8000}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.network.modelNamespace }}
          podSelector:
            matchLabels: {app.kubernetes.io/name: milvus, component: standalone}
      ports: [{port: 19530}]
    {{- range .Values.indexing.nasCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        {{- range $.Values.indexing.nasPorts }}
        - port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
