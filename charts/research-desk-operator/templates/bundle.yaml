apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operator.name" . }}-bundle
  labels:
    {{- include "operator.labels" . | nindent 4 }}
data:
  watches.yaml: |
    - group: research.daviestechlabs.io
      version: v1alpha1
      kind: ResearchDesk
      chart: /opt/helm/bundle/research-desk
      reconcilePeriod: 1m
      watchDependentResources: true
  {{- range $path, $_ := .Files.Glob "files/research-desk/**" }}
  {{ $path | replace "/" "__" | quote }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
