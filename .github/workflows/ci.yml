name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make test check
      - run: python3 scripts/check-public.py
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v4.3.0
      - run: python3 -m pip install -r operator/requirements-test.txt
      - run: python3 scripts/test-helm.py
      - run: python3 scripts/check-js.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 -t research-assistant:check .
      - run: docker run --rm research-assistant:check check-tools
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: python3 scripts/test-postgres-local.py
