# Create the namespace and database owner Secret through your deployment system first.
# Adapt storage class, capacity, placement, resources, and physical backups before use.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: research-pg
  namespace: research
spec:
  instances: 3
  storage:
    size: 128Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  bootstrap:
    initdb:
      database: research
      owner: desk_owner
      secret: {name: research-pg-owner}
      dataChecksums: true
  certificates:
    serverAltDNSNames:
      - research-pg-pooler.research.svc.cluster.local
  postgresql:
    parameters:
      max_connections: "100"
      log_statement: none
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: research-pg-pooler
  namespace: research
spec:
  cluster: {name: research-pg}
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "100"
      default_pool_size: "10"
      reserve_pool_size: "2"
      max_db_connections: "30"
      max_user_connections: "20"
      log_connections: "0"
      log_disconnections: "0"
